name: Build APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extract and Build APK
        run: |
          # জিপ ফাইল আনপ্যাক
          unzip -o "*.zip" -d .

          # থিম ঠিক করা
          sed -i 's/Theme.047AutoAccept/Theme.AutoAccept/g' app/src/main/res/values/themes.xml || true
          sed -i 's/Theme.047AutoAccept/Theme.AutoAccept/g' app/src/main/AndroidManifest.xml || true

          # আইকন এরর পুরোপুরি রিমুভ করা
          sed -i 's/android:icon="[^"]*"//g' app/src/main/AndroidManifest.xml || true
          sed -i 's/android:roundIcon="[^"]*"//g' app/src/main/AndroidManifest.xml || true

          # ফ্রেশ ও নিরাপদ MainActivity
          cat << 'EOF' > app/src/main/java/com/autoaccept/store047/MainActivity.kt
          package com.autoaccept.store047

          import android.content.Intent
          import android.os.Bundle
          import android.provider.Settings
          import android.widget.Button
          import android.widget.LinearLayout
          import android.widget.TextView
          import androidx.activity.ComponentActivity

          class MainActivity : ComponentActivity() {
              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  val layout = LinearLayout(this).apply {
                      orientation = LinearLayout.VERTICAL
                      setPadding(60, 100, 60, 60)
                  }
                  val title = TextView(this).apply {
                      text = "047 Auto Accept Assistant"
                      textSize = 22f
                  }
                  val sub = TextView(this).apply {
                      text = "Branch 047 order monitoring is ACTIVE."
                      textSize = 14f
                      setPadding(0, 20, 0, 40)
                  }
                  val btn = Button(this).apply {
                      text = "Open Accessibility Settings"
                      setOnClickListener {
                          startActivity(Intent(Settings.ACTION_ACCESSIBILITY_SETTINGS))
                      }
                  }
                  layout.addView(title)
                  layout.addView(sub)
                  layout.addView(btn)
                  setContentView(layout)
              }
          }
          EOF

          # আসল APK কম্পাইল করা
          gradle assembleDebug

      - name: Upload Finished APK
        uses: actions/upload-artifact@v4
        with:
          name: 047-AutoAccept-APK
          path: app/build/outputs/apk/debug/*.apk
