name: Build APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extract and Build APK
        run: |
          # সব জিপ ফাইল খুঁজে আনজিপ করা
          unzip -o "*.zip" -d .

          # SDK ও থিম অটো-ফিক্স
          sed -i 's/compileSdk = 35/compileSdk = 34/g' app/build.gradle.kts || true
          sed -i 's/targetSdk = 35/targetSdk = 34/g' app/build.gradle.kts || true
          sed -i 's/Theme.047AutoAccept/Theme.AutoAccept/g' app/src/main/res/values/themes.xml || true
          sed -i 's/Theme.047AutoAccept/Theme.AutoAccept/g' app/src/main/AndroidManifest.xml || true
          sed -i 's/@mipmap\/ic_launcher/@android:drawable\/sym_def_app_icon/g' app/src/main/AndroidManifest.xml || true
          sed -i 's/@mipmap\/ic_launcher_round/@android:drawable\/sym_def_app_icon/g' app/src/main/AndroidManifest.xml || true

          # আসল APK কম্পাইল করা
          gradle assembleDebug

      - name: Upload Finished APK
        uses: actions/upload-artifact@v4
        with:
          name: 047-AutoAccept-APK
          path: app/build/outputs/apk/debug/*.apk
