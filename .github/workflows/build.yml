name: Build APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build McDonald's 047 APK
        run: |
          # ১. আনজিপ
          unzip -o "*.zip" -d .

          # ২. থিম ফিক্স
          sed -i 's/Theme.047AutoAccept/Theme.AutoAccept/g' app/src/main/res/values/themes.xml || true
          sed -i 's/Theme.047AutoAccept/Theme.AutoAccept/g' app/src/main/AndroidManifest.xml || true

          # ৩. ম্যাকডোনাল্ডস (McDonald's) গোল্ডেন "M" ও রেড ব্যাকগ্রাউন্ড শর্টকাট লোগো
          cat << 'EOF' > app/src/main/res/drawable/ic_launcher_background.xml
          <?xml version="1.0" encoding="utf-8"?>
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="108dp"
              android:height="108dp"
              android:viewportWidth="108"
              android:viewportHeight="108">
              <path
                  android:fillColor="#DA291C"
                  android:pathData="M0,0h108v108h-108z"/>
          </vector>
          EOF

          cat << 'EOF' > app/src/main/res/drawable/ic_launcher_foreground.xml
          <?xml version="1.0" encoding="utf-8"?>
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="108dp"
              android:height="108dp"
              android:viewportWidth="108"
              android:viewportHeight="108">
              <path
                  android:fillColor="#FFC72C"
                  android:pathData="M24,78 C24,45 36,32 48,32 C52,32 54,37 54,44 C54,37 56,32 60,32 C72,32 84,45 84,78 L74,78 C74,48 66,40 60,40 C56,40 54,46 54,58 L54,78 L48,78 L48,58 C48,46 46,40 42,40 C36,40 28,48 28,78 Z" />
          </vector>
          EOF

          # ৪. অটোমেশন ডিফল্ট TRUE করা
          sed -i 's/DEFAULT_AUTOMATION_ENABLED = false/DEFAULT_AUTOMATION_ENABLED = true/g' app/src/main/java/com/autoaccept/store047/data/PreferencesManager.kt || true

          # ৫. আপনার ছবি থাকলে তা ব্যাকগ্রাউন্ড হিসেবে যুক্ত করা
          for img in photo.jpg photo.png my_photo.jpg my_photo.png; do
            if [ -f "$img" ]; then
              cp "$img" app/src/main/res/drawable/user_background.png || cp "$img" app/src/main/res/drawable/user_background.jpg || true
              break
            fi
          done

          # ৬. অন/অফ সুইচ ও ম্যাকডোনাল্ডস ডিজাইন সহ MainActivity
          cat << 'EOF' > app/src/main/java/com/autoaccept/store047/MainActivity.kt
          package com.autoaccept.store047

          import android.content.Context
          import android.content.Intent
          import android.graphics.Color
          import android.graphics.Typeface
          import android.graphics.drawable.GradientDrawable
          import android.os.Bundle
          import android.provider.Settings
          import android.view.Gravity
          import android.widget.Button
          import android.widget.LinearLayout
          import android.widget.TextView
          import android.widget.Toast
          import androidx.activity.ComponentActivity
          import com.autoaccept.store047.data.PreferencesManager
          import kotlinx.coroutines.flow.StateFlow

          class MainActivity : ComponentActivity() {

              private lateinit var prefs: PreferencesManager
              private lateinit var statusText: TextView
              private lateinit var toggleBtn: Button

              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  prefs = PreferencesManager.getInstance(this)
                  prefs.setAutomationEnabled(true)

                  val root = LinearLayout(this).apply {
                      orientation = LinearLayout.VERTICAL
                      setBackgroundColor(Color.parseColor("#0F172A"))
                      setPadding(48, 70, 48, 50)
                      gravity = Gravity.CENTER_HORIZONTAL
                  }

                  // McDonald's Header Badge
                  val mcdBadge = TextView(this).apply {
                      text = "M"
                      setTextColor(Color.parseColor("#FFC72C"))
                      textSize = 38f
                      typeface = Typeface.DEFAULT_BOLD
                      gravity = Gravity.CENTER
                      background = GradientDrawable().apply {
                          setColor(Color.parseColor("#DA291C"))
                          cornerRadius = 24f
                      }
                      layoutParams = LinearLayout.LayoutParams(120, 120).apply {
                          setMargins(0, 0, 0, 24)
                      }
                  }
                  root.addView(mcdBadge)

                  val title = TextView(this).apply {
                      text = "047 Auto Accept Pro"
                      setTextColor(Color.WHITE)
                      textSize = 24f
                      typeface = Typeface.DEFAULT_BOLD
                      gravity = Gravity.CENTER
                  }
                  root.addView(title)

                  val sub = TextView(this).apply {
                      text = "McDonald's Store 047 Assistant"
                      setTextColor(Color.parseColor("#FFC72C"))
                      textSize = 14f
                      typeface = Typeface.DEFAULT_BOLD
                      gravity = Gravity.CENTER
                      setPadding(0, 8, 0, 40)
                  }
                  root.addView(sub)

                  // Status Text
                  statusText = TextView(this).apply {
                      textSize = 17f
                      typeface = Typeface.DEFAULT_BOLD
                      gravity = Gravity.CENTER
                      setPadding(0, 0, 0, 24)
                  }
                  root.addView(statusText)

                  // ON / OFF TOGGLE BUTTON
                  toggleBtn = Button(this).apply {
                      textSize = 16f
                      typeface = Typeface.DEFAULT_BOLD
                      setTextColor(Color.WHITE)
                      layoutParams = LinearLayout.LayoutParams(
                          LinearLayout.LayoutParams.MATCH_PARENT,
                          140
                      )
                      setOnClickListener {
                          val current = prefs.isAutomationEnabled.value
                          val newState = !current
                          prefs.setAutomationEnabled(newState)
                          updateUI(newState)
                          Toast.makeText(
                              this@MainActivity,
                              if (newState) "✅ অটো-এক্সেপ্ট চালু হয়েছে!" else "⏸️ অটো-এক্সেপ্ট বন্ধ করা হয়েছে",
                              Toast.LENGTH_SHORT
                          ).show()
                      }
                  }
                  root.addView(toggleBtn)

                  // Accessibility Settings Button
                  val permBtn = Button(this).apply {
                      text = "Open Accessibility Settings"
                      textSize = 14f
                      typeface = Typeface.DEFAULT_BOLD
                      setTextColor(Color.WHITE)
                      val lp = LinearLayout.LayoutParams(
                          LinearLayout.LayoutParams.MATCH_PARENT,
                          130
                      ).apply { setMargins(0, 30, 0, 0) }
                      layoutParams = lp
                      background = GradientDrawable().apply {
                          setColor(Color.parseColor("#2563EB"))
                          cornerRadius = 18f
                      }
                      setOnClickListener {
                          startActivity(Intent(Settings.ACTION_ACCESSIBILITY_SETTINGS))
                      }
                  }
                  root.addView(permBtn)

                  setContentView(root)
                  updateUI(prefs.isAutomationEnabled.value)
              }

              private fun updateUI(enabled: Boolean) {
                  if (enabled) {
                      statusText.text = "● অটো-এক্সেপ্ট: চালু আছে (ACTIVE)"
                      statusText.setTextColor(Color.parseColor("#22C55E"))
                      toggleBtn.text = "⏸️ বন্ধ করুন (Turn OFF)"
                      toggleBtn.background = GradientDrawable().apply {
                          setColor(Color.parseColor("#DC2626"))
                          cornerRadius = 18f
                      }
                  } else {
                      statusText.text = "● অটো-এক্সেপ্ট: বন্ধ আছে (OFF)"
                      statusText.setTextColor(Color.parseColor("#EF4444"))
                      toggleBtn.text = "▶️ চালু করুন (Turn ON)"
                      toggleBtn.background = GradientDrawable().apply {
                          setColor(Color.parseColor("#16A34A"))
                          cornerRadius = 18f
                      }
                  }
              }

              override fun onResume() {
                  super.onResume()
                  updateUI(prefs.isAutomationEnabled.value)
              }
          }
          EOF

          # ৭. বিল্ড রান
          gradle assembleDebug

      - name: Upload Finished APK
        uses: actions/upload-artifact@v4
        with:
          name: 047-AutoAccept-APK
          path: app/build/outputs/apk/debug/*.apk
