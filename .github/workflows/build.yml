name: Build APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build McDonald's Custom APK
        run: |
          # ১. আনজিপ
          unzip -o "*.zip" -d .

          # ২. ফোল্ডার তৈরি (যাতে আর কখনো ফাইল মিসিং এরর না আসে)
          mkdir -p app/src/main/res/drawable

          # ৩. ম্যাকডোনাল্ডস (McDonald's) অফিসিয়াল লোগো ফাইল তৈরি
          cat << 'EOF' > app/src/main/res/drawable/mcdonalds_logo.xml
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="108dp"
              android:height="108dp"
              android:viewportWidth="108"
              android:viewportHeight="108">
              <path
                  android:fillColor="#DA291C"
                  android:pathData="M0,0h108v108h-108z" />
              <path
                  android:fillColor="#FFC72C"
                  android:pathData="M30,80 C30,48 40,36 50,36 C53,36 54,40 54,46 C54,40 55,36 58,36 C68,36 78,48 78,80 L70,80 C70,52 64,44 58,44 C55,44 54,48 54,58 L54,80 L48,80 L48,58 C48,48 47,44 44,44 C38,44 32,52 32,80 Z" />
          </vector>
          EOF

          # ৪. শর্টকাট আইকন হিসেবে ম্যাকডোনাল্ডস লোগো সেট করা
          sed -i 's/Theme.047AutoAccept/Theme.AutoAccept/g' app/src/main/res/values/themes.xml || true
          sed -i 's/Theme.047AutoAccept/Theme.AutoAccept/g' app/src/main/AndroidManifest.xml || true
          sed -i 's|@mipmap/ic_launcher_round|@drawable/mcdonalds_logo|g' app/src/main/AndroidManifest.xml || true
          sed -i 's|@mipmap/ic_launcher|@drawable/mcdonalds_logo|g' app/src/main/AndroidManifest.xml || true

          # ৫. অটোমেশন ডিফল্ট সর্বদা ON রাখা
          sed -i 's/DEFAULT_AUTOMATION_ENABLED = false/DEFAULT_AUTOMATION_ENABLED = true/g' app/src/main/java/com/autoaccept/store047/data/PreferencesManager.kt || true

          # ৬. অন/অফ সুইচ, ব্যাকগ্রাউন্ড ফটো ও টেস্ট বাটন সহ সম্পূর্ণ স্ক্রিন
          cat << 'EOF' > app/src/main/java/com/autoaccept/store047/MainActivity.kt
          package com.autoaccept.store047

          import android.app.AlertDialog
          import android.content.Context
          import android.content.Intent
          import android.graphics.BitmapFactory
          import android.graphics.Color
          import android.graphics.Typeface
          import android.graphics.drawable.GradientDrawable
          import android.os.Bundle
          import android.os.Handler
          import android.os.Looper
          import android.provider.Settings
          import android.view.Gravity
          import android.view.View
          import android.widget.Button
          import android.widget.FrameLayout
          import android.widget.ImageView
          import android.widget.LinearLayout
          import android.widget.ScrollView
          import android.widget.Switch
          import android.widget.TextView
          import android.widget.Toast
          import androidx.activity.ComponentActivity
          import java.io.File
          import java.io.FileOutputStream

          class MainActivity : ComponentActivity() {

              private val PICK_IMAGE_REQUEST = 1001
              private lateinit var switchToggle: Switch
              private lateinit var statusBadge: TextView
              private lateinit var statusDesc: TextView
              private lateinit var btnPermission: Button
              private lateinit var rootContainer: FrameLayout
              private lateinit var bgImageView: ImageView
              private val handler = Handler(Looper.getMainLooper())

              private val refreshRunnable = object : Runnable {
                  override fun run() {
                      updateUI()
                      handler.postDelayed(this, 1000)
                  }
              }

              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)

                  val sp = getSharedPreferences("auto_accept_047_prefs", Context.MODE_PRIVATE)
                  if (!sp.contains("key_automation_enabled")) {
                      sp.edit().putBoolean("key_automation_enabled", true).apply()
                  }

                  rootContainer = FrameLayout(this)

                  // ব্যাকগ্রাউন্ড ছবি
                  bgImageView = ImageView(this).apply {
                      layoutParams = FrameLayout.LayoutParams(
                          FrameLayout.LayoutParams.MATCH_PARENT,
                          FrameLayout.LayoutParams.MATCH_PARENT
                      )
                      scaleType = ImageView.ScaleType.CENTER_CROP
                  }
                  rootContainer.addView(bgImageView)

                  // ডার্ক গ্লাস ওভারলে
                  val overlay = View(this).apply {
                      layoutParams = FrameLayout.LayoutParams(
                          FrameLayout.LayoutParams.MATCH_PARENT,
                          FrameLayout.LayoutParams.MATCH_PARENT
                      )
                      setBackgroundColor(Color.parseColor("#E6090D16"))
                  }
                  rootContainer.addView(overlay)

                  val scrollView = ScrollView(this).apply {
                      isFillViewport = true
                  }

                  val content = LinearLayout(this).apply {
                      orientation = LinearLayout.VERTICAL
                      setPadding(44, 50, 44, 50)
                  }
                  scrollView.addView(content)

                  // হেডার: ম্যাকডোনাল্ডস ব্র্যান্ডিং
                  val headerLayout = LinearLayout(this).apply {
                      orientation = LinearLayout.HORIZONTAL
                      gravity = Gravity.CENTER_VERTICAL
                      setPadding(0, 0, 0, 36)
                  }
                  val mcdBadge = TextView(this).apply {
                      text = "M"
                      setTextColor(Color.parseColor("#FFC72C"))
                      textSize = 34f
                      typeface = Typeface.DEFAULT_BOLD
                      gravity = Gravity.CENTER
                      val bg = GradientDrawable().apply {
                          setColor(Color.parseColor("#DA291C"))
                          cornerRadius = 24f
                      }
                      background = bg
                      val lp = LinearLayout.LayoutParams(110, 110).apply { setMargins(0, 0, 30, 0) }
                      layoutParams = lp
                  }
                  val titleLayout = LinearLayout(this).apply {
                      orientation = LinearLayout.VERTICAL
                  }
                  val title = TextView(this).apply {
                      text = "047 Auto Accept"
                      setTextColor(Color.WHITE)
                      textSize = 23f
                      typeface = Typeface.DEFAULT_BOLD
                  }
                  val sub = TextView(this).apply {
                      text = "McDonald's Store 047 Assistant"
                      setTextColor(Color.parseColor("#FFC72C"))
                      textSize = 13f
                      typeface = Typeface.DEFAULT_BOLD
                  }
                  titleLayout.addView(title)
                  titleLayout.addView(sub)
                  headerLayout.addView(mcdBadge)
                  headerLayout.addView(titleLayout)
                  content.addView(headerLayout)

                  // ছবি আপলোড বাটন
                  val changePhotoBtn = Button(this).apply {
                      text = "📸 গ্যালারি থেকে ব্যাকগ্রাউন্ডে নিজের ছবি দিন"
                      setTextColor(Color.WHITE)
                      textSize = 13f
                      typeface = Typeface.DEFAULT_BOLD
                      background = GradientDrawable().apply {
                          setColor(Color.parseColor("#374151"))
                          cornerRadius = 16f
                      }
                      val lp = LinearLayout.LayoutParams(
                          LinearLayout.LayoutParams.MATCH_PARENT,
                          LinearLayout.LayoutParams.WRAP_CONTENT
                      ).apply { setMargins(0, 0, 0, 30) }
                      layoutParams = lp
                      setOnClickListener {
                          val intent = Intent(Intent.ACTION_PICK)
                          intent.type = "image/*"
                          startActivityForResult(intent, PICK_IMAGE_REQUEST)
                      }
                  }
                  content.addView(changePhotoBtn)

                  // ১. মাস্টার অন/অফ সুইচ
                  val switchCard = LinearLayout(this).apply {
                      orientation = LinearLayout.HORIZONTAL
                      gravity = Gravity.CENTER_VERTICAL
                      setPadding(40, 36, 40, 36)
                      background = GradientDrawable().apply {
                          cornerRadius = 24f
                          setColor(Color.parseColor("#161E2E"))
                          setStroke(2, Color.parseColor("#27354A"))
                      }
                  }
                  val switchTextLayout = LinearLayout(this).apply {
                      orientation = LinearLayout.VERTICAL
                      layoutParams = LinearLayout.LayoutParams(0, LinearLayout.LayoutParams.WRAP_CONTENT, 1f)
                  }
                  val switchLabel = TextView(this).apply {
                      text = "অটো-এক্সেপ্ট (Auto Click)"
                      setTextColor(Color.WHITE)
                      textSize = 17f
                      typeface = Typeface.DEFAULT_BOLD
                  }
                  val switchSub = TextView(this).apply {
                      text = "চালু থাকলে ০৪৭ অর্ডার পলকে ক্লিক হবে"
                      setTextColor(Color.parseColor("#94A3B8"))
                      textSize = 12f
                      setPadding(0, 4, 0, 0)
                  }
                  switchTextLayout.addView(switchLabel)
                  switchTextLayout.addView(switchSub)

                  val isAutoEnabled = sp.getBoolean("key_automation_enabled", true)
                  switchToggle = Switch(this).apply {
                      isChecked = isAutoEnabled
                      scaleX = 1.2f
                      scaleY = 1.2f
                      setOnCheckedChangeListener { _, isChecked ->
                          val prefs = getSharedPreferences("auto_accept_047_prefs", Context.MODE_PRIVATE)
                          prefs.edit().putBoolean("key_automation_enabled", isChecked).apply()
                          Toast.makeText(
                              this@MainActivity,
                              if (isChecked) "অটো-এক্সেপ্ট চালু হয়েছে" else "অটো-এক্সেপ্ট বন্ধ করা হয়েছে",
                              Toast.LENGTH_SHORT
                          ).show()
                          updateUI()
                      }
                  }
                  switchCard.addView(switchTextLayout)
                  switchCard.addView(switchToggle)
                  content.addView(switchCard)

                  // ২. এক্সেসিবিলিটি স্ট্যাটাস কার্ড
                  val statusCard = LinearLayout(this).apply {
                      orientation = LinearLayout.VERTICAL
                      setPadding(40, 36, 40, 36)
                      val lp = LinearLayout.LayoutParams(
                          LinearLayout.LayoutParams.MATCH_PARENT,
                          LinearLayout.LayoutParams.WRAP_CONTENT
                      ).apply { setMargins(0, 26, 0, 26) }
                      layoutParams = lp
                      background = GradientDrawable().apply {
                          cornerRadius = 24f
                          setColor(Color.parseColor("#161E2E"))
                      }
                  }
                  statusBadge = TextView(this).apply {
                      textSize = 15f
                      typeface = Typeface.DEFAULT_BOLD
                  }
                  statusDesc = TextView(this).apply {
                      textSize = 12f
                      setTextColor(Color.parseColor("#94A3B8"))
                      setPadding(0, 10, 0, 24)
                  }
                  btnPermission = Button(this).apply {
                      text = "Open Accessibility Settings"
                      setTextColor(Color.WHITE)
                      textSize = 14f
                      typeface = Typeface.DEFAULT_BOLD
                      background = GradientDrawable().apply {
                          setColor(Color.parseColor("#2563EB"))
                          cornerRadius = 18f
                      }
                      setOnClickListener {
                          startActivity(Intent(Settings.ACTION_ACCESSIBILITY_SETTINGS))
                      }
                  }
                  statusCard.addView(statusBadge)
                  statusCard.addView(statusDesc)
                  statusCard.addView(btnPermission)
                  content.addView(statusCard)

                  // ৩. টেস্ট বাটন
                  val testBtn = Button(this).apply {
                      text = "🧪 টেস্ট করুন (Test 047 Order)"
                      setTextColor(Color.WHITE)
                      textSize = 14f
                      typeface = Typeface.DEFAULT_BOLD
                      val lp = LinearLayout.LayoutParams(
                          LinearLayout.LayoutParams.MATCH_PARENT,
                          LinearLayout.LayoutParams.WRAP_CONTENT
                      ).apply { setMargins(0, 10, 0, 20) }
                      layoutParams = lp
                      background = GradientDrawable().apply {
                          setColor(Color.parseColor("#059669"))
                          cornerRadius = 18f
                      }
                      setOnClickListener {
                          showSimulator()
                      }
                  }
                  content.addView(testBtn)

                  rootContainer.addView(scrollView)
                  setContentView(rootContainer)
                  loadSavedPhoto()
              }

              override fun onActivityResult(requestCode: Int, resultCode: Int, data: Intent?) {
                  super.onActivityResult(requestCode, resultCode, data)
                  if (requestCode == PICK_IMAGE_REQUEST && resultCode == RESULT_OK && data?.data != null) {
                      try {
                          val inputStream = contentResolver.openInputStream(data.data!!)
                          val file = File(filesDir, "custom_bg.jpg")
                          val outputStream = FileOutputStream(file)
                          inputStream?.copyTo(outputStream)
                          inputStream?.close()
                          outputStream.close()
                          loadSavedPhoto()
                          Toast.makeText(this, "ব্যাকগ্রাউন্ডে ছবি সেট হয়েছে!", Toast.LENGTH_SHORT).show()
                      } catch (e: Exception) {
                          Toast.makeText(this, "ছবি লোড করা যায়নি", Toast.LENGTH_SHORT).show()
                      }
                  }
              }

              private fun loadSavedPhoto() {
                  val file = File(filesDir, "custom_bg.jpg")
                  if (file.exists()) {
                      val bitmap = BitmapFactory.decodeFile(file.absolutePath)
                      bgImageView.setImageBitmap(bitmap)
                  }
              }

              private fun showSimulator() {
                  val layout = LinearLayout(this).apply {
                      orientation = LinearLayout.VERTICAL
                      setBackgroundColor(Color.parseColor("#1E293B"))
                      setPadding(50, 50, 50, 50)
                      gravity = Gravity.CENTER_HORIZONTAL
                  }
                  val text = TextView(this).apply {
                      text = "নতুন অর্ডার: ব্রাঞ্চ 047"
                      setTextColor(Color.WHITE)
                      textSize = 20f
                      typeface = Typeface.DEFAULT_BOLD
                  }
                  val btn = Button(this).apply {
                      text = "Accept the order"
                      setTextColor(Color.WHITE)
                      textSize = 15f
                      background = GradientDrawable().apply {
                          setColor(Color.parseColor("#DA291C"))
                          cornerRadius = 16f
                      }
                      setOnClickListener {
                          Toast.makeText(this@MainActivity, "টেস্ট সফল! অটো-এক্সেপ্ট ০৪৭ অর্ডার ধরে ফেলেছে!", Toast.LENGTH_LONG).show()
                      }
                  }
                  layout.addView(text)
                  layout.addView(View(this).apply { layoutParams = LinearLayout.LayoutParams(1, 30) })
                  layout.addView(btn)

                  AlertDialog.Builder(this)
                      .setView(layout)
                      .create()
                      .show()
              }

              private fun isAccessibilityEnabled(): Boolean {
                  val service = "${packageName}/com.autoaccept.store047.service.AutoAcceptAccessibilityService"
                  val enabledServices = Settings.Secure.getString(
                      contentResolver,
                      Settings.Secure.ENABLED_ACCESSIBILITY_SERVICES
                  ) ?: return false
                  return enabledServices.contains(service) || enabledServices.contains("AutoAcceptAccessibilityService")
              }

              private fun updateUI() {
                  val accessEnabled = isAccessibilityEnabled()
                  val sp = getSharedPreferences("auto_accept_047_prefs", Context.MODE_PRIVATE)
                  val autoEnabled = sp.getBoolean("key_automation_enabled", true)

                  if (accessEnabled && autoEnabled) {
                      statusBadge.text = "● এক্সেসিবিলিটি সার্ভিস: সক্রিয় (ACTIVE)"
                      statusBadge.setTextColor(Color.parseColor("#22C55E"))
                      statusDesc.text = "অটো-এক্সেপ্ট সম্পূর্ণ তৈরি এবং ব্যাকগ্রাউন্ডে কাজ করছে।"
                      btnPermission.text = "সার্ভিস চালু আছে"
                      btnPermission.background = GradientDrawable().apply {
                          setColor(Color.parseColor("#15803D"))
                          cornerRadius = 18f
                      }
                  } else if (accessEnabled && !autoEnabled) {
                      statusBadge.text = "অটো-এক্সেপ্ট বন্ধ (PAUSED)"
                      statusBadge.setTextColor(Color.parseColor("#F59E0B"))
                      statusDesc.text = "উপরে থাকা অন/অফ সুইচ দিয়ে চালু করুন।"
                      btnPermission.text = "সার্ভিস রেডি (পজ করা)"
                      btnPermission.background = GradientDrawable().apply {
                          setColor(Color.parseColor("#4B5563"))
                          cornerRadius = 18f
                      }
                  } else {
                      statusBadge.text = "● এক্সেসিবিলিটি পারমিশন প্রয়োজন (OFF)"
                      statusBadge.setTextColor(Color.parseColor("#EF4444"))
                      statusDesc.text = "অ্যাপ কাজ করার জন্য নিচের বাটনে চাপ দিয়ে সার্ভিসটি ON করুন।"
                      btnPermission.text = "Open Accessibility Settings"
                      btnPermission.background = GradientDrawable().apply {
                          setColor(Color.parseColor("#2563EB"))
                          cornerRadius = 18f
                      }
                  }
              }

              override fun onResume() {
                  super.onResume()
                  val sp = getSharedPreferences("auto_accept_047_prefs", Context.MODE_PRIVATE)
                  switchToggle.isChecked = sp.getBoolean("key_automation_enabled", true)
                  updateUI()
                  handler.post(refreshRunnable)
              }

              override fun onPause() {
                  super.onPause()
                  handler.removeCallbacks(refreshRunnable)
              }
          }
          EOF

          # ৭. বিল্ড সম্পন্ন করা
          gradle assembleDebug

      - name: Upload Finished APK
        uses: actions/upload-artifact@v4
        with:
          name: 047-AutoAccept-APK
          path: app/build/outputs/apk/debug/*.apk
