name: Build APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build mr.wow Universal APK
        run: |
          # ১. আনজিপ
          unzip -o "*.zip" -d .

          # ২. অ্যাপ নাম ও থিম
          sed -i 's/<string name="app_name">.*<\/string>/<string name="app_name">mr.wow<\/string>/g' app/src/main/res/values/strings.xml || true
          sed -i 's/Theme.047AutoAccept/Theme.AutoAccept/g' app/src/main/res/values/themes.xml || true
          sed -i 's/Theme.047AutoAccept/Theme.AutoAccept/g' app/src/main/AndroidManifest.xml || true

          # ৩. অ্যাক্সেসিবিলিটি কনফিগে ফুল স্ক্রিন জেসচার সক্রিয় করা
          mkdir -p app/src/main/res/xml
          cat << 'EOF' > app/src/main/res/xml/accessibility_service_config.xml
          <?xml version="1.0" encoding="utf-8"?>
          <accessibility-service xmlns:android="http://schemas.android.com/apk/res/android"
              android:accessibilityEventTypes="typeWindowStateChanged|typeWindowContentChanged"
              android:accessibilityFeedbackType="feedbackGeneric"
              android:accessibilityFlags="flagDefault|flagRetrieveInteractiveWindows|flagIncludeNotImportantViews"
              android:canPerformGestures="true"
              android:canRetrieveWindowContent="true"
              android:description="@string/app_name"
              android:notificationTimeout="80" />
          EOF

          # ৪. যেকোনো মোবাইলে স্বয়ংক্রিয় এডজাস্ট হওয়ার ইউনিভার্সাল সোয়াইপ ইঞ্জিন
          cat << 'EOF' > app/src/main/java/com/autoaccept/store047/engine/AutomationEngine.kt
          package com.autoaccept.store047.engine

          import android.accessibilityservice.AccessibilityService
          import android.accessibilityservice.GestureDescription
          import android.graphics.Path
          import android.graphics.Rect
          import android.view.accessibility.AccessibilityNodeInfo
          import android.widget.Toast
          import kotlinx.coroutines.CoroutineScope
          import kotlinx.coroutines.Dispatchers
          import kotlinx.coroutines.launch

          object AutomationEngine {

              private var lastProcessedTime: Long = 0

              fun processWindow(service: AccessibilityService, rootNode: AccessibilityNodeInfo?) {
                  if (rootNode == null) return

                  val currentTime = System.currentTimeMillis()
                  if (currentTime - lastProcessedTime < 2500) return

                  val allTexts = mutableListOf<String>()
                  collectTexts(rootNode, allTexts)
                  val combined = allTexts.joinToString(" ").lowercase()

                  // ০৪৭ ব্রাঞ্চ ডিটেকশন
                  val hasStore047 = combined.contains("047") || combined.contains("nahda") || combined.contains("6283")

                  if (hasStore047) {
                      // ১. স্ক্রিন সাইজ যাই হোক না কেন সরাসরি "Accept" বাটনটির আসল অবস্থান বের করা
                      val acceptNode = findAcceptNode(rootNode)

                      if (acceptNode != null) {
                          lastProcessedTime = currentTime
                          val bounds = Rect()
                          acceptNode.getBoundsInScreen(bounds)

                          // বাটনটির সাইজ এবং উচ্চতা অনুযায়ী স্বয়ংক্রিয়ভাবে কোঅর্ডিনেট হিসাব
                          val startX = bounds.left.toFloat() + (bounds.height() / 2f)
                          val endX = bounds.right.toFloat() - (bounds.height() / 4f)
                          val centerY = bounds.exactCenterY()

                          performUniversalSwipe(service, startX, endX, centerY)

                          // ব্যাকআপ হিসেবে সাধারণ ট্যাপও পাঠিয়ে রাখা
                          try {
                              acceptNode.performAction(AccessibilityNodeInfo.ACTION_CLICK)
                          } catch (e: Exception) {}

                          CoroutineScope(Dispatchers.Main).launch {
                              Toast.makeText(service, "⚡ mr.wow: Auto-Swiped Store 047!", Toast.LENGTH_SHORT).show()
                          }
                      } else {
                          // স্ক্রিন সাইজ অনুযায়ী ফলব্যাক ডায়নামিক সোয়াইপ
                          val metrics = service.resources.displayMetrics
                          val w = metrics.widthPixels.toFloat()
                          val h = metrics.heightPixels.toFloat()

                          lastProcessedTime = currentTime
                          performUniversalSwipe(service, w * 0.12f, w * 0.88f, h * 0.52f)
                      }
                  }
              }

              // মানুষের আঙুলের মতো সঠিক প্রেসিং ও মুভমেন্ট নিশ্চিত করা
              private fun performUniversalSwipe(service: AccessibilityService, startX: Float, endX: Float, y: Float) {
                  val swipePath = Path().apply {
                      moveTo(startX, y)
                      lineTo(endX, y)
                  }

                  val gesture = GestureDescription.Builder()
                      .addStroke(GestureDescription.StrokeDescription(swipePath, 0, 400))
                      .build()

                  service.dispatchGesture(gesture, null, null)
              }

              private fun findAcceptNode(node: AccessibilityNodeInfo): AccessibilityNodeInfo? {
                  val text = (node.text?.toString() ?: "") + " " + (node.contentDescription?.toString() ?: "")
                  val lower = text.lowercase()

                  if (lower.contains("accept") || lower.contains("swipe") || lower.contains("slide")) {
                      return node
                  }

                  for (i in 0 until node.childCount) {
                      val child = node.getChild(i) ?: continue
                      val found = findAcceptNode(child)
                      if (found != null) return found
                  }
                  return null
              }

              private fun collectTexts(node: AccessibilityNodeInfo, list: MutableList<String>) {
                  node.text?.let { list.add(it.toString()) }
                  node.contentDescription?.let { list.add(it.toString()) }
                  for (i in 0 until node.childCount) {
                      val child = node.getChild(i) ?: continue
                      collectTexts(child, list)
                  }
              }
          }
          EOF

          # ৫. APK কম্পাইল
          gradle assembleDebug

      - name: Upload Finished APK
        uses: actions/upload-artifact@v4
        with:
          name: mr-wow-APK
          path: app/build/outputs/apk/debug/*.apk
