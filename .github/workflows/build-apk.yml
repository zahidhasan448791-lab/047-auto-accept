name: Build APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build Clean APK
        run: |
          # ১. আসল জিপ আনজিপ
          unzip -o "*.zip" -d .

          # ২. অ্যাপ নাম ও থিম ফিক্স (যা সফল বিল্ডে কাজ করেছিল)
          sed -i 's/<string name="app_name">.*<\/string>/<string name="app_name">mr.wow<\/string>/g' app/src/main/res/values/strings.xml || true
          sed -i 's/Theme.047AutoAccept/Theme.AutoAccept/g' app/src/main/res/values/themes.xml || true
          sed -i 's/Theme.047AutoAccept/Theme.AutoAccept/g' app/src/main/AndroidManifest.xml || true

          # ৩. মিসিং আইকন দূর করা
          sed -i 's/android:icon="[^"]*"//g' app/src/main/AndroidManifest.xml || true
          sed -i 's/android:roundIcon="[^"]*"//g' app/src/main/AndroidManifest.xml || true

          # ৪. অ্যাক্সেসিবিলিটি ফাইলে সোয়াইপ পারমিশন নিশ্চিত করা (কোড স্পর্শ না করে)
          sed -i 's/<accessibility-service/& android:canPerformGestures="true"/' app/src/main/res/xml/*.xml || true

          # ৫. ডিফল্ট অটোমেশন সর্বদা TRUE
          sed -i 's/DEFAULT_AUTOMATION_ENABLED = false/DEFAULT_AUTOMATION_ENABLED = true/g' app/src/main/java/com/autoaccept/store047/data/PreferencesManager.kt || true

          # ৬. সরাসরি অরিজিনাল কোড কম্পাইল করা
          gradle assembleDebug

      - name: Upload Finished APK
        uses: actions/upload-artifact@v4
        with:
          name: mr-wow-APK
          path: app/build/outputs/apk/debug/*.apk
