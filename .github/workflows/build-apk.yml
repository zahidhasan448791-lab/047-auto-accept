name: Build APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          clean: true

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build Fresh APK
        run: |
          # ১. গিটহাবে আগে পুশ হওয়া সব পুরনো আনজিপ ফাইল সম্পূর্ণ মুছে ক্লিন করা
          rm -rf app settings.gradle* build.gradle* gradle*

          # ২. আসল জিপ ফ্রেশ আনজিপ করা
          unzip -q -o "*.zip" -d .

          # ৩. ম্যানিফেস্ট ও থিম ফিক্স (যা বিল্ড #৬ এ সফল হয়েছিল)
          sed -i 's/Theme.047AutoAccept/Theme.AutoAccept/g' app/src/main/res/values/themes.xml 2>/dev/null || true
          sed -i 's/Theme.047AutoAccept/Theme.AutoAccept/g' app/src/main/AndroidManifest.xml 2>/dev/null || true
          sed -i 's/android:icon="[^"]*"//g' app/src/main/AndroidManifest.xml 2>/dev/null || true
          sed -i 's/android:roundIcon="[^"]*"//g' app/src/main/AndroidManifest.xml 2>/dev/null || true

          # ৪. কোনো প্রকার কোটলিন ফাইল এডিট না করে সরাসরি ফ্রেশ বিল্ড
          gradle clean assembleDebug --no-daemon

      - name: Upload Finished APK
        uses: actions/upload-artifact@v4
        with:
          name: 047-AutoAccept-APK
          path: app/build/outputs/apk/debug/*.apk
