name: Build APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build 047 Auto Accept APK
        run: |
          # ১. আনজিপ
          unzip -o "*.zip" -d .

          # ২. থিম ও ম্যানিফেস্ট ফিক্স
          sed -i 's/Theme.047AutoAccept/Theme.AutoAccept/g' app/src/main/res/values/themes.xml || true
          sed -i 's/Theme.047AutoAccept/Theme.AutoAccept/g' app/src/main/AndroidManifest.xml || true
          sed -i 's/android:icon="[^"]*"//g' app/src/main/AndroidManifest.xml || true
          sed -i 's/android:roundIcon="[^"]*"//g' app/src/main/AndroidManifest.xml || true

          # ৩. ডিফল্ট অটোমেশন সর্বদা TRUE করা
          sed -i 's/DEFAULT_AUTOMATION_ENABLED = false/DEFAULT_AUTOMATION_ENABLED = true/g' app/src/main/java/com/autoaccept/store047/data/PreferencesManager.kt || true

          # ৪. সহজ অন/অফ সুইচ ও ক্লিন ডিজাইন সহ MainActivity
          cat << 'EOF' > app/src/main/java/com/autoaccept/store047/MainActivity.kt
          package com.autoaccept.store047

          import android.content.Context
          import android.content.Intent
          import android.graphics.Color
          import android.graphics.Typeface
          import android.graphics.drawable.GradientDrawable
          import android.os.Bundle
          import android.provider.Settings
          import android.view.Gravity
          import android.widget.Button
          import android.widget.LinearLayout
          import android.widget.TextView
          import android.widget.Toast
          import androidx.activity.ComponentActivity
          import com.autoaccept.store047.data.PreferencesManager

          class MainActivity : ComponentActivity() {

              private lateinit var prefs: PreferencesManager
              private var isEnabled = true
              private lateinit var statusText: TextView
              private lateinit var toggleBtn: Button

              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  prefs = PreferencesManager.getInstance(this)

                  val sp = getSharedPreferences("auto_accept_047_prefs", Context.MODE_PRIVATE)
                  isEnabled = sp.getBoolean("key_automation_enabled", true)
                  prefs.setAutomationEnabled(isEnabled)

                  val root = LinearLayout(this).apply {
                      orientation = LinearLayout.VERTICAL
                      setBackgroundColor(Color.parseColor("#0F172A"))
                      setPadding(48, 80, 48, 50)
                      gravity = Gravity.CENTER_HORIZONTAL
                  }

                  val title = TextView(this).apply {
                      text = "047 Auto Accept"
                      setTextColor(Color.WHITE)
                      textSize = 25f
                      typeface = Typeface.DEFAULT_BOLD
                      gravity = Gravity.CENTER
                  }
                  root.addView(title)

                  val sub = TextView(this).apply {
                      text = "Branch 047 High-Speed Assistant"
                      setTextColor(Color.parseColor("#38BDF8"))
                      textSize = 14f
                      typeface = Typeface.DEFAULT_BOLD
                      gravity = Gravity.CENTER
                      setPadding(0, 10, 0, 40)
                  }
                  root.addView(sub)

                  statusText = TextView(this).apply {
                      textSize = 17f
                      typeface = Typeface.DEFAULT_BOLD
                      gravity = Gravity.CENTER
                      setPadding(0, 0, 0, 24)
                  }
                  root.addView(statusText)

                  // ON / OFF বাটন
                  toggleBtn = Button(this).apply {
                      textSize = 16f
                      typeface = Typeface.DEFAULT_BOLD
                      setTextColor(Color.WHITE)
                      layoutParams = LinearLayout.LayoutParams(
                          LinearLayout.LayoutParams.MATCH_PARENT,
                          140
                      )
                      setOnClickListener {
                          isEnabled = !isEnabled
                          prefs.setAutomationEnabled(isEnabled)
                          updateUI()
                          Toast.makeText(
                              this@MainActivity,
                              if (isEnabled) "অটো-এক্সেপ্ট চালু হয়েছে" else "অটো-এক্সেপ্ট বন্ধ করা হয়েছে",
                              Toast.LENGTH_SHORT
                          ).show()
                      }
                  }
                  root.addView(toggleBtn)

                  // এক্সেসিবিলিটি সেটিংস ওপেন বাটন
                  val permBtn = Button(this).apply {
                      text = "Open Accessibility Settings"
                      textSize = 14f
                      typeface = Typeface.DEFAULT_BOLD
                      setTextColor(Color.WHITE)
                      val lp = LinearLayout.LayoutParams(
                          LinearLayout.LayoutParams.MATCH_PARENT,
                          130
                      ).apply { setMargins(0, 30, 0, 0) }
                      layoutParams = lp
                      background = GradientDrawable().apply {
                          setColor(Color.parseColor("#2563EB"))
                          cornerRadius = 18f
                      }
                      setOnClickListener {
                          startActivity(Intent(Settings.ACTION_ACCESSIBILITY_SETTINGS))
                      }
                  }
                  root.addView(permBtn)

                  setContentView(root)
                  updateUI()
              }

              private fun updateUI() {
                  if (isEnabled) {
                      statusText.text = "● অটো-এক্সেপ্ট: চালু আছে (ACTIVE)"
                      statusText.setTextColor(Color.parseColor("#22C55E"))
                      toggleBtn.text = "অটো-এক্সেপ্ট বন্ধ করুন (OFF)"
                      toggleBtn.background = GradientDrawable().apply {
                          setColor(Color.parseColor("#DC2626"))
                          cornerRadius = 18f
                      }
                  } else {
                      statusText.text = "● অটো-এক্সেপ্ট: বন্ধ আছে (OFF)"
                      statusText.setTextColor(Color.parseColor("#EF4444"))
                      toggleBtn.text = "অটো-এক্সেপ্ট চালু করুন (ON)"
                      toggleBtn.background = GradientDrawable().apply {
                          setColor(Color.parseColor("#16A34A"))
                          cornerRadius = 18f
                      }
                  }
              }

              override fun onResume() {
                  super.onResume()
                  val sp = getSharedPreferences("auto_accept_047_prefs", Context.MODE_PRIVATE)
                  isEnabled = sp.getBoolean("key_automation_enabled", true)
                  updateUI()
              }
          }
          EOF

          # ৫. আসল APK বিল্ড করা
          gradle assembleDebug

      - name: Upload Finished APK
        uses: actions/upload-artifact@v4
        with:
          name: 047-AutoAccept-APK
          path: app/build/outputs/apk/debug/*.apk
