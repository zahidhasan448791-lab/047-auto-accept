name: Build APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Diagnose and Build
        run: |
          # ১. ফ্রেশ আনজিপ
          unzip -q -o "*.zip" -d .

          # ২. থিম ও ম্যানিফেস্ট ফিক্স
          sed -i 's/Theme.047AutoAccept/Theme.AutoAccept/g' app/src/main/res/values/themes.xml 2>/dev/null || true
          sed -i 's/Theme.047AutoAccept/Theme.AutoAccept/g' app/src/main/AndroidManifest.xml 2>/dev/null || true
          sed -i 's/android:icon="[^"]*"//g' app/src/main/AndroidManifest.xml 2>/dev/null || true
          sed -i 's/android:roundIcon="[^"]*"//g' app/src/main/AndroidManifest.xml 2>/dev/null || true

          # ৩. আসল এরর দেখার জন্য বিস্তারিত লগসহ কম্পাইল
          ./gradlew assembleDebug --stacktrace || gradle assembleDebug --stacktrace

      - name: Upload Finished APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: 047-AutoAccept-APK
          path: app/build/outputs/apk/debug/*.apk
