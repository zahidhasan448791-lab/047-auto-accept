name: Build APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build mr.wow Official APK
        run: |
          # ১. আসল জিপ আনজিপ
          unzip -o "*.zip" -d .

          # ২. অ্যাপের নাম পরিবর্তন করে mr.wow করা
          sed -i 's/<string name="app_name">.*<\/string>/<string name="app_name">mr.wow<\/string>/g' app/src/main/res/values/strings.xml || true

          # ৩. মোবাইলের হোমস্ক্রিনের জন্য ম্যাকডোনাল্ডসের গোল্ডেন "M" লোগো তৈরি
          mkdir -p app/src/main/res/mipmap-anydpi-v26
          mkdir -p app/src/main/res/drawable

          cat << 'EOF' > app/src/main/res/drawable/ic_mcd_bg.xml
          <?xml version="1.0" encoding="utf-8"?>
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="108dp"
              android:height="108dp"
              android:viewportWidth="108"
              android:viewportHeight="108">
              <path
                  android:fillColor="#DA291C"
                  android:pathData="M0,0h108v108h-108z"/>
          </vector>
          EOF

          cat << 'EOF' > app/src/main/res/drawable/ic_mcd_fg.xml
          <?xml version="1.0" encoding="utf-8"?>
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="108dp"
              android:height="108dp"
              android:viewportWidth="108"
              android:viewportHeight="108">
              <path
                  android:fillColor="#FFC72C"
                  android:pathData="M24,78 C24,45 36,32 48,32 C52,32 54,37 54,44 C54,37 56,32 60,32 C72,32 84,45 84,78 L74,78 C74,48 66,40 60,40 C56,40 54,46 54,58 L54,78 L48,78 L48,58 C48,46 46,40 42,40 C36,40 28,48 28,78 Z" />
          </vector>
          EOF

          cat << 'EOF' > app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml
          <?xml version="1.0" encoding="utf-8"?>
          <adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">
              <background android:drawable="@drawable/ic_mcd_bg"/>
              <foreground android:drawable="@drawable/ic_mcd_fg"/>
          </adaptive-icon>
          EOF

          cat << 'EOF' > app/src/main/res/mipmap-anydpi-v26/ic_launcher_round.xml
          <?xml version="1.0" encoding="utf-8"?>
          <adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">
              <background android:drawable="@drawable/ic_mcd_bg"/>
              <foreground android:drawable="@drawable/ic_mcd_fg"/>
          </adaptive-icon>
          EOF

          # ৪. থিম ও নোটিফিকেশন পারমিশন ফিক্স
          sed -i 's/Theme.047AutoAccept/Theme.AutoAccept/g' app/src/main/res/values/themes.xml || true
          sed -i 's/Theme.047AutoAccept/Theme.AutoAccept/g' app/src/main/AndroidManifest.xml || true
          sed -i 's/<manifest[^>]*>/&\n    <uses-permission android:name="android.permission.POST_NOTIFICATIONS" \/>/' app/src/main/AndroidManifest.xml || true

          # ৫. ডিফল্ট অটোমেশন সর্বদা TRUE
          sed -i 's/DEFAULT_AUTOMATION_ENABLED = false/DEFAULT_AUTOMATION_ENABLED = true/g' app/src/main/java/com/autoaccept/store047/data/PreferencesManager.kt || true

          # ৬. পারফেক্ট mr.wow MainActivity (Jetpack Compose + নোটিফিকেশন সাপোর্ট)
          cat << 'EOF' > app/src/main/java/com/autoaccept/store047/MainActivity.kt
          package com.autoaccept.store047

          import android.Manifest
          import android.app.NotificationChannel
          import android.app.NotificationManager
          import android.app.PendingIntent
          import android.content.Context
          import android.content.Intent
          import android.content.pm.PackageManager
          import android.os.Build
          import android.os.Bundle
          import android.provider.Settings
          import android.widget.Toast
          import androidx.activity.ComponentActivity
          import androidx.activity.compose.setContent
          import androidx.activity.result.contract.ActivityResultContracts
          import androidx.compose.foundation.background
          import androidx.compose.foundation.layout.*
          import androidx.compose.foundation.rememberScrollState
          import androidx.compose.foundation.shape.RoundedCornerShape
          import androidx.compose.foundation.verticalScroll
          import androidx.compose.material3.*
          import androidx.compose.runtime.*
          import androidx.compose.ui.Alignment
          import androidx.compose.ui.Modifier
          import androidx.compose.ui.graphics.Color
          import androidx.compose.ui.text.font.FontWeight
          import androidx.compose.ui.text.style.TextAlign
          import androidx.compose.ui.unit.dp
          import androidx.compose.ui.unit.sp
          import androidx.core.app.NotificationCompat
          import androidx.core.content.ContextCompat
          import com.autoaccept.store047.data.PreferencesManager

          class MainActivity : ComponentActivity() {

              private val CHANNEL_ID = "mr_wow_channel_high"
              private val NOTIFICATION_ID = 47001
              private lateinit var prefs: PreferencesManager

              private val requestPermissionLauncher = registerForActivityResult(
                  ActivityResultContracts.RequestPermission()
              ) { isGranted: Boolean ->
                  if (isGranted) {
                      showRunningNotification()
                  }
              }

              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  prefs = PreferencesManager.getInstance(this)
                  createNotificationChannel()
                  askNotificationPermission()

                  setContent {
                      var hasPermission by remember { mutableStateOf(isAccessibilityEnabled()) }
                      val isAutoEnabled by prefs.isAutomationEnabled.collectAsState(initial = true)

                      LaunchedEffect(Unit) {
                          while (true) {
                              val current = isAccessibilityEnabled()
                              if (current != hasPermission) {
                                  hasPermission = current
                              }
                              kotlinx.coroutines.delay(1000)
                          }
                      }

                      LaunchedEffect(isAutoEnabled, hasPermission) {
                          if (isAutoEnabled && hasPermission) {
                              showRunningNotification()
                          } else {
                              cancelRunningNotification()
                          }
                      }

                      MaterialTheme {
                          Surface(
                              modifier = Modifier.fillMaxSize(),
                              color = Color(0xFF0B0F19)
                          ) {
                              if (!hasPermission) {
                                  PermissionScreen(
                                      onOpenSettings = {
                                          startActivity(Intent(Settings.ACTION_ACCESSIBILITY_SETTINGS))
                                      }
                                  )
                              } else {
                                  DashboardScreen(
                                      isEnabled = isAutoEnabled,
                                      onToggle = { enabled ->
                                          prefs.setAutomationEnabled(enabled)
                                          if (enabled) {
                                              showRunningNotification()
                                              Toast.makeText(this@MainActivity, "mr.wow is ACTIVE", Toast.LENGTH_SHORT).show()
                                          } else {
                                              cancelRunningNotification()
                                              Toast.makeText(this@MainActivity, "mr.wow is STOPPED", Toast.LENGTH_SHORT).show()
                                          }
                                      }
                                  )
                              }
                          }
                      }
                  }
              }

              private fun askNotificationPermission() {
                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.TIRAMISU) {
                      if (ContextCompat.checkSelfPermission(this, Manifest.permission.POST_NOTIFICATIONS) != PackageManager.PERMISSION_GRANTED) {
                          requestPermissionLauncher.launch(Manifest.permission.POST_NOTIFICATIONS)
                      }
                  }
              }

              private fun createNotificationChannel() {
                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) {
                      val channel = NotificationChannel(
                          CHANNEL_ID,
                          "mr.wow Active Service",
                          NotificationManager.IMPORTANCE_HIGH
                      ).apply {
                          description = "Shows real-time status of mr.wow auto accept"
                          setShowBadge(true)
                          lockscreenVisibility = android.app.Notification.VISIBILITY_PUBLIC
                      }
                      val nm = getSystemService(Context.NOTIFICATION_SERVICE) as NotificationManager
                      nm.createNotificationChannel(channel)
                  }
              }

              private fun showRunningNotification() {
                  try {
                      val intent = Intent(this, MainActivity::class.java).apply {
                          flags = Intent.FLAG_ACTIVITY_SINGLE_TOP or Intent.FLAG_ACTIVITY_CLEAR_TOP
                      }
                      val pendingIntent = PendingIntent.getActivity(
                          this,
                          0,
                          intent,
                          PendingIntent.FLAG_UPDATE_CURRENT or PendingIntent.FLAG_IMMUTABLE
                      )

                      val builder = NotificationCompat.Builder(this, CHANNEL_ID)
                          .setSmallIcon(android.R.drawable.stat_notify_sync)
                          .setContentTitle("mr.wow - Active & Running")
                          .setContentText("Monitoring Store 047 orders in real-time.")
                          .setPriority(NotificationCompat.PRIORITY_MAX)
                          .setOngoing(true)
                          .setSilent(true)
                          .setContentIntent(pendingIntent)

                      val nm = getSystemService(Context.NOTIFICATION_SERVICE) as NotificationManager
                      nm.notify(NOTIFICATION_ID, builder.build())
                  } catch (e: Exception) {}
              }

              private fun cancelRunningNotification() {
                  try {
                      val nm = getSystemService(Context.NOTIFICATION_SERVICE) as NotificationManager
                      nm.cancel(NOTIFICATION_ID)
                  } catch (e: Exception) {}
              }

              private fun isAccessibilityEnabled(): Boolean {
                  val service = "${packageName}/com.autoaccept.store047.service.AutoAcceptAccessibilityService"
                  val enabledServices = Settings.Secure.getString(
                      contentResolver,
                      Settings.Secure.ENABLED_ACCESSIBILITY_SERVICES
                  ) ?: return false
                  return enabledServices.contains(packageName) || enabledServices.contains("AutoAcceptAccessibilityService")
              }
          }

          @Composable
          fun PermissionScreen(onOpenSettings: () -> Unit) {
              Column(
                  modifier = Modifier
                      .fillMaxSize()
                      .padding(32.dp),
                  horizontalAlignment = Alignment.CenterHorizontally,
                  verticalArrangement = Arrangement.Center
              ) {
                  Text(text = "⚡", fontSize = 60.sp)
                  Spacer(modifier = Modifier.height(20.dp))
                  Text(
                      text = "Accessibility Required",
                      color = Color.White,
                      fontSize = 24.sp,
                      fontWeight = FontWeight.Bold,
                      textAlign = TextAlign.Center
                  )
                  Spacer(modifier = Modifier.height(16.dp))
                  Text(
                      text = "mr.wow needs Accessibility Service permission to auto-accept Store 047 orders.\n\nOnce enabled, this setup screen will disappear permanently.",
                      color = Color(0xFF94A3B8),
                      fontSize = 14.sp,
                      textAlign = TextAlign.Center
                  )
                  Spacer(modifier = Modifier.height(36.dp))
                  Button(
                      onClick = onOpenSettings,
                      modifier = Modifier
                          .fillMaxWidth()
                          .height(56.dp),
                      shape = RoundedCornerShape(16.dp),
                      colors = ButtonDefaults.buttonColors(containerColor = Color(0xFF2563EB))
                  ) {
                      Text(text = "ENABLE ACCESSIBILITY PERMISSION", fontWeight = FontWeight.Bold)
                  }
              }
          }

          @Composable
          fun DashboardScreen(isEnabled: Boolean, onToggle: (Boolean) -> Unit) {
              Column(
                  modifier = Modifier
                      .fillMaxSize()
                      .verticalScroll(rememberScrollState())
                      .padding(horizontal = 24.dp, vertical = 40.dp),
                  horizontalAlignment = Alignment.CenterHorizontally
              ) {
                  Text(
                      text = "mr.wow",
                      color = Color.White,
                      fontSize = 32.sp,
                      fontWeight = FontWeight.Bold
                  )
                  Text(
                      text = "Store 047 High-Speed Assistant",
                      color = Color(0xFF38BDF8),
                      fontSize = 14.sp,
                      fontWeight = FontWeight.Medium
                  )
                  Spacer(modifier = Modifier.height(30.dp))

                  Card(
                      modifier = Modifier.fillMaxWidth(),
                      shape = RoundedCornerShape(20.dp),
                      colors = CardDefaults.cardColors(containerColor = Color(0xFF161E2E))
                  ) {
                      Column(
                          modifier = Modifier
                              .fillMaxWidth()
                              .padding(24.dp),
                          horizontalAlignment = Alignment.CenterHorizontally
                      ) {
                          Text(
                              text = if (isEnabled) "● STATUS: RUNNING (ACTIVE)" else "● STATUS: STOPPED (OFF)",
                              color = if (isEnabled) Color(0xFF22C55E) else Color(0xFFEF4444),
                              fontSize = 18.sp,
                              fontWeight = FontWeight.Bold
                          )
                          Spacer(modifier = Modifier.height(8.dp))
                          Text(
                              text = if (isEnabled)
                                  "Auto-accept is active and monitoring Store 047 orders."
                              else
                                  "Service is paused. No auto-clicks will happen.",
                              color = if (isEnabled) Color(0xFF86EFAC) else Color(0xFFFCA5A5),
                              fontSize = 13.sp,
                              textAlign = TextAlign.Center
                          )
                      }
                  }

                  Spacer(modifier = Modifier.height(28.dp))

                  Row(
                      modifier = Modifier
                          .fillMaxWidth()
                          .height(60.dp),
                      horizontalArrangement = Arrangement.spacedBy(16.dp)
                  ) {
                      Button(
                          onClick = { onToggle(true) },
                          modifier = Modifier
                              .weight(1f)
                              .fillMaxHeight(),
                          shape = RoundedCornerShape(16.dp),
                          colors = ButtonDefaults.buttonColors(
                              containerColor = if (isEnabled) Color(0xFF15803D) else Color(0xFF1E293B)
                          )
                      ) {
                          Text(
                              text = "🟢 ON (START)",
                              fontWeight = FontWeight.Bold,
                              color = Color.White
                          )
                      }

                      Button(
                          onClick = { onToggle(false) },
                          modifier = Modifier
                              .weight(1f)
                              .fillMaxHeight(),
                          shape = RoundedCornerShape(16.dp),
                          colors = ButtonDefaults.buttonColors(
                              containerColor = if (!isEnabled) Color(0xFFDC2626) else Color(0xFF1E293B)
                          )
                      ) {
                          Text(
                              text = "🔴 OFF (STOP)",
                              fontWeight = FontWeight.Bold,
                              color = Color.White
                          )
                      }
                  }
              }
          }
          EOF

          # ৭. আসল APK কম্পাইল করা
          gradle assembleDebug

      - name: Upload Finished APK
        uses: actions/upload-artifact@v4
        with:
          name: mr-wow-APK
          path: app/build/outputs/apk/debug/*.apk
