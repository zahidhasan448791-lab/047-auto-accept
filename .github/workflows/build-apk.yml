name: Build APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build mr.wow APK
        run: |
          # ১. আনজিপ
          unzip -o "*.zip" -d .

          # ২. অ্যাপের নাম "mr.wow" এবং থিম ফিক্স
          sed -i 's/<string name="app_name">.*<\/string>/<string name="app_name">mr.wow<\/string>/g' app/src/main/res/values/strings.xml || true
          sed -i 's/Theme.047AutoAccept/Theme.AutoAccept/g' app/src/main/res/values/themes.xml || true
          sed -i 's/Theme.047AutoAccept/Theme.AutoAccept/g' app/src/main/AndroidManifest.xml || true

          # ৩. ডিফল্ট অটোমেশন সর্বদা TRUE রাখা
          sed -i 's/DEFAULT_AUTOMATION_ENABLED = false/DEFAULT_AUTOMATION_ENABLED = true/g' app/src/main/java/com/autoaccept/store047/data/PreferencesManager.kt || true

          # ৪. mr.wow MainActivity (ইংলিশ ইন্টারফেস, রানিং নোটিফিকেশন ও আলাদা পারমিশন পেজ)
          cat << 'EOF' > app/src/main/java/com/autoaccept/store047/MainActivity.kt
          package com.autoaccept.store047

          import android.app.AlertDialog
          import android.app.NotificationChannel
          import android.app.NotificationManager
          import android.app.PendingIntent
          import android.content.Context
          import android.content.Intent
          import android.graphics.Color
          import android.graphics.Typeface
          import android.graphics.drawable.GradientDrawable
          import android.os.Build
          import android.os.Bundle
          import android.provider.Settings
          import android.view.Gravity
          import android.view.View
          import android.widget.Button
          import android.widget.FrameLayout
          import android.widget.LinearLayout
          import android.widget.ScrollView
          import android.widget.TextView
          import android.widget.Toast
          import androidx.activity.ComponentActivity
          import androidx.core.app.NotificationCompat
          import com.autoaccept.store047.data.PreferencesManager

          class MainActivity : ComponentActivity() {

              private val CHANNEL_ID = "mr_wow_channel"
              private val NOTIFICATION_ID = 47001

              private lateinit var prefs: PreferencesManager
              private lateinit var container: FrameLayout
              private lateinit var statusText: TextView
              private lateinit var statusDesc: TextView
              private lateinit var btnOn: Button
              private lateinit var btnOff: Button
              private var isEnabled = true

              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  prefs = PreferencesManager.getInstance(this)
                  createNotificationChannel()

                  val sp = getSharedPreferences("auto_accept_047_prefs", Context.MODE_PRIVATE)
                  isEnabled = sp.getBoolean("key_automation_enabled", true)
                  prefs.setAutomationEnabled(isEnabled)

                  if (isEnabled && isAccessibilityEnabled()) {
                      showRunningNotification()
                  }

                  container = FrameLayout(this)
                  setContentView(container)
                  refreshScreens()
              }

              private fun createNotificationChannel() {
                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) {
                      val name = "mr.wow Status"
                      val descriptionText = "Shows background running status of mr.wow"
                      val channel = NotificationChannel(CHANNEL_ID, name, NotificationManager.IMPORTANCE_LOW).apply {
                          description = descriptionText
                          setShowBadge(false)
                      }
                      val nm = getSystemService(Context.NOTIFICATION_SERVICE) as NotificationManager
                      nm.createNotificationChannel(channel)
                  }
              }

              private fun showRunningNotification() {
                  try {
                      val intent = Intent(this, MainActivity::class.java).apply {
                          flags = Intent.FLAG_ACTIVITY_SINGLE_TOP or Intent.FLAG_ACTIVITY_CLEAR_TOP
                      }
                      val pendingIntent = PendingIntent.getActivity(
                          this,
                          0,
                          intent,
                          PendingIntent.FLAG_UPDATE_CURRENT or PendingIntent.FLAG_IMMUTABLE
                      )

                      val builder = NotificationCompat.Builder(this, CHANNEL_ID)
                          .setSmallIcon(android.R.drawable.stat_notify_sync)
                          .setContentTitle("mr.wow - Active & Running")
                          .setContentText("Monitoring Store 047 orders in high-speed mode.")
                          .setPriority(NotificationCompat.PRIORITY_LOW)
                          .setOngoing(true)
                          .setContentIntent(pendingIntent)

                      val nm = getSystemService(Context.NOTIFICATION_SERVICE) as NotificationManager
                      nm.notify(NOTIFICATION_ID, builder.build())
                  } catch (e: Exception) {}
              }

              private fun cancelRunningNotification() {
                  try {
                      val nm = getSystemService(Context.NOTIFICATION_SERVICE) as NotificationManager
                      nm.cancel(NOTIFICATION_ID)
                  } catch (e: Exception) {}
              }

              private fun isAccessibilityEnabled(): Boolean {
                  val enabledServices = Settings.Secure.getString(
                      contentResolver,
                      Settings.Secure.ENABLED_ACCESSIBILITY_SERVICES
                  ) ?: return false
                  return enabledServices.contains(packageName) || enabledServices.contains("AutoAcceptAccessibilityService")
              }

              private fun refreshScreens() {
                  container.removeAllViews()
                  if (!isAccessibilityEnabled()) {
                      container.addView(createPermissionPage())
                  } else {
                      container.addView(createDashboardPage())
                  }
              }

              // Permission Page (Shown ONLY until granted)
              private fun createPermissionPage(): View {
                  val layout = LinearLayout(this).apply {
                      orientation = LinearLayout.VERTICAL
                      setBackgroundColor(Color.parseColor("#0B0F19"))
                      setPadding(48, 120, 48, 60)
                      gravity = Gravity.CENTER_HORIZONTAL
                  }

                  val icon = TextView(this).apply {
                      text = "⚡"
                      textSize = 50f
                      gravity = Gravity.CENTER
                      setPadding(0, 0, 0, 24)
                  }
                  layout.addView(icon)

                  val title = TextView(this).apply {
                      text = "Accessibility Permission Required"
                      setTextColor(Color.WHITE)
                      textSize = 21f
                      typeface = Typeface.DEFAULT_BOLD
                      gravity = Gravity.CENTER
                  }
                  layout.addView(title)

                  val desc = TextView(this).apply {
                      text = "mr.wow needs Accessibility Service permission to auto-accept Store 047 orders in real-time.\n\nOnce granted, this screen will never show again."
                      setTextColor(Color.parseColor("#94A3B8"))
                      textSize = 14f
                      gravity = Gravity.CENTER
                      setPadding(0, 16, 0, 50)
                  }
                  layout.addView(desc)

                  val btn = Button(this).apply {
                      text = "OPEN ACCESSIBILITY SETTINGS"
                      setTextColor(Color.WHITE)
                      textSize = 14f
                      typeface = Typeface.DEFAULT_BOLD
                      background = GradientDrawable().apply {
                          setColor(Color.parseColor("#2563EB"))
                          cornerRadius = 20f
                      }
                      layoutParams = LinearLayout.LayoutParams(
                          LinearLayout.LayoutParams.MATCH_PARENT,
                          140
                      )
                      setOnClickListener {
                          startActivity(Intent(Settings.ACTION_ACCESSIBILITY_SETTINGS))
                      }
                  }
                  layout.addView(btn)
                  return layout
              }

              // Main Dashboard
              private fun createDashboardPage(): View {
                  val scrollView = ScrollView(this).apply {
                      setBackgroundColor(Color.parseColor("#0B0F19"))
                      isFillViewport = true
                  }

                  val root = LinearLayout(this).apply {
                      orientation = LinearLayout.VERTICAL
                      setPadding(44, 70, 44, 50)
                      gravity = Gravity.CENTER_HORIZONTAL
                  }
                  scrollView.addView(root)

                  val title = TextView(this).apply {
                      text = "mr.wow"
                      setTextColor(Color.WHITE)
                      textSize = 30f
                      typeface = Typeface.DEFAULT_BOLD
                      gravity = Gravity.CENTER
                  }
                  root.addView(title)

                  val sub = TextView(this).apply {
                      text = "Store 047 High-Speed Assistant"
                      setTextColor(Color.parseColor("#38BDF8"))
                      textSize = 13f
                      typeface = Typeface.DEFAULT_BOLD
                      gravity = Gravity.CENTER
                      setPadding(0, 6, 0, 40)
                  }
                  root.addView(sub)

                  // Status Card
                  val statusCard = LinearLayout(this).apply {
                      orientation = LinearLayout.VERTICAL
                      setPadding(40, 36, 40, 36)
                      gravity = Gravity.CENTER_HORIZONTAL
                      layoutParams = LinearLayout.LayoutParams(
                          LinearLayout.LayoutParams.MATCH_PARENT,
                          LinearLayout.LayoutParams.WRAP_CONTENT
                      ).apply { setMargins(0, 0, 0, 36) }
                      background = GradientDrawable().apply {
                          cornerRadius = 24f
                          setColor(Color.parseColor("#161E2E"))
                      }
                  }

                  statusText = TextView(this).apply {
                      textSize = 18f
                      typeface = Typeface.DEFAULT_BOLD
                      gravity = Gravity.CENTER
                  }
                  statusDesc = TextView(this).apply {
                      textSize = 13f
                      gravity = Gravity.CENTER
                      setPadding(0, 10, 0, 0)
                  }
                  statusCard.addView(statusText)
                  statusCard.addView(statusDesc)
                  root.addView(statusCard)

                  // Two Buttons: ON and OFF
                  val buttonRow = LinearLayout(this).apply {
                      orientation = LinearLayout.HORIZONTAL
                      layoutParams = LinearLayout.LayoutParams(
                          LinearLayout.LayoutParams.MATCH_PARENT,
                          145
                      ).apply { setMargins(0, 0, 0, 30) }
                  }

                  btnOn = Button(this).apply {
                      text = "🟢 ON (START)"
                      textSize = 15f
                      typeface = Typeface.DEFAULT_BOLD
                      setTextColor(Color.WHITE)
                      val p = LinearLayout.LayoutParams(0, LinearLayout.LayoutParams.MATCH_PARENT, 1f).apply {
                          setMargins(0, 0, 14, 0)
                      }
                      layoutParams = p
                      setOnClickListener {
                          setAutomation(true)
                      }
                  }

                  btnOff = Button(this).apply {
                      text = "🔴 OFF (STOP)"
                      textSize = 15f
                      typeface = Typeface.DEFAULT_BOLD
                      setTextColor(Color.WHITE)
                      val p = LinearLayout.LayoutParams(0, LinearLayout.LayoutParams.MATCH_PARENT, 1f).apply {
                          setMargins(14, 0, 0, 0)
                      }
                      layoutParams = p
                      setOnClickListener {
                          setAutomation(false)
                      }
                  }

                  buttonRow.addView(btnOn)
                  buttonRow.addView(btnOff)
                  root.addView(buttonRow)

                  // Test Simulator
                  val testBtn = Button(this).apply {
                      text = "🧪 Test 047 Simulator"
                      setTextColor(Color.WHITE)
                      textSize = 14f
                      typeface = Typeface.DEFAULT_BOLD
                      val lp = LinearLayout.LayoutParams(
                          LinearLayout.LayoutParams.MATCH_PARENT,
                          125
                      ).apply { setMargins(0, 20, 0, 0) }
                      layoutParams = lp
                      background = GradientDrawable().apply {
                          setColor(Color.parseColor("#334155"))
                          cornerRadius = 18f
                      }
                      setOnClickListener {
                          showSimulator()
                      }
                  }
                  root.addView(testBtn)

                  updateButtonsUI()
                  return scrollView
              }

              private fun setAutomation(enabled: Boolean) {
                  isEnabled = enabled
                  prefs.setAutomationEnabled(enabled)
                  val sp = getSharedPreferences("auto_accept_047_prefs", Context.MODE_PRIVATE)
                  sp.edit().putBoolean("key_automation_enabled", enabled).apply()

                  if (enabled) {
                      showRunningNotification()
                      Toast.makeText(this, "✅ mr.wow is ACTIVE!", Toast.LENGTH_SHORT).show()
                  } else {
                      cancelRunningNotification()
                      Toast.makeText(this, "⏸️ mr.wow is STOPPED!", Toast.LENGTH_SHORT).show()
                  }
                  updateButtonsUI()
              }

              private fun updateButtonsUI() {
                  if (isEnabled) {
                      statusText.text = "● STATUS: RUNNING (ACTIVE)"
                      statusText.setTextColor(Color.parseColor("#22C55E"))
                      statusDesc.text = "Auto-accept is active and scanning Store 047 orders."
                      statusDesc.setTextColor(Color.parseColor("#86EFAC"))

                      btnOn.background = GradientDrawable().apply {
                          setColor(Color.parseColor("#15803D"))
                          cornerRadius = 18f
                      }
                      btnOff.background = GradientDrawable().apply {
                          setColor(Color.parseColor("#1E293B"))
                          cornerRadius = 18f
                      }
                  } else {
                      statusText.text = "● STATUS: STOPPED (OFF)"
                      statusText.setTextColor(Color.parseColor("#EF4444"))
                      statusDesc.text = "Service is paused. No clicks will be made."
                      statusDesc.setTextColor(Color.parseColor("#FCA5A5"))

                      btnOn.background = GradientDrawable().apply {
                          setColor(Color.parseColor("#1E293B"))
                          cornerRadius = 18f
                      }
                      btnOff.background = GradientDrawable().apply {
                          setColor(Color.parseColor("#DC2626"))
                          cornerRadius = 18f
                      }
                  }
              }

              private fun showSimulator() {
                  val layout = LinearLayout(this).apply {
                      orientation = LinearLayout.VERTICAL
                      setBackgroundColor(Color.parseColor("#1E293B"))
                      setPadding(50, 50, 50, 50)
                      gravity = Gravity.CENTER_HORIZONTAL
                  }
                  val text = TextView(this).apply {
                      text = "New Order: Store 047"
                      setTextColor(Color.WHITE)
                      textSize = 20f
                      typeface = Typeface.DEFAULT_BOLD
                  }
                  val btn = Button(this).apply {
                      text = "Accept the order"
                      setTextColor(Color.WHITE)
                      textSize = 15f
                      background = GradientDrawable().apply {
                          setColor(Color.parseColor("#F59E0B"))
                          cornerRadius = 16f
                      }
                      setOnClickListener {
                          Toast.makeText(this@MainActivity, "Simulation Success: 047 clicked!", Toast.LENGTH_LONG).show()
                      }
                  }
                  layout.addView(text)
                  layout.addView(View(this).apply { layoutParams = LinearLayout.LayoutParams(1, 30) })
                  layout.addView(btn)

                  AlertDialog.Builder(this)
                      .setView(layout)
                      .create()
                      .show()
              }

              override fun onResume() {
                  super.onResume()
                  val sp = getSharedPreferences("auto_accept_047_prefs", Context.MODE_PRIVATE)
                  isEnabled = sp.getBoolean("key_automation_enabled", true)
                  if (isEnabled && isAccessibilityEnabled()) {
                      showRunningNotification()
                  }
                  refreshScreens()
              }
          }
          EOF

          # ৫. আসল APK কম্পাইল করা
          gradle assembleDebug

      - name: Upload Finished APK
        uses: actions/upload-artifact@v4
        with:
          name: mr-wow-APK
          path: app/build/outputs/apk/debug/*.apk
