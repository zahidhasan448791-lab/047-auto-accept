name: Build APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build APK
        run: |
          # ১. আনজিপ
          unzip -o "*.zip" -d .

          # ২. শুধুমাত্র থিম নেম ফিক্স (যা বিল্ড #৬ এ সফল হয়েছিল)
          sed -i 's/Theme.047AutoAccept/Theme.AutoAccept/g' app/src/main/res/values/themes.xml || true
          sed -i 's/Theme.047AutoAccept/Theme.AutoAccept/g' app/src/main/AndroidManifest.xml || true
          sed -i 's/android:icon="[^"]*"//g' app/src/main/AndroidManifest.xml || true
          sed -i 's/android:roundIcon="[^"]*"//g' app/src/main/AndroidManifest.xml || true

          # ৩. ডিফল্ট অটোমেশন সর্বদা অন রাখা
          sed -i 's/DEFAULT_AUTOMATION_ENABLED = false/DEFAULT_AUTOMATION_ENABLED = true/g' app/src/main/java/com/autoaccept/store047/data/PreferencesManager.kt || true

          # ৪. আসল APK তৈরি করা
          gradle assembleDebug

      - name: Upload Finished APK
        uses: actions/upload-artifact@v4
        with:
          name: 047-AutoAccept-APK
          path: app/build/outputs/apk/debug/*.apk
