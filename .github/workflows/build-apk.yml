name: Build APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build mr.wow Official APK
        run: |
          # ১. আসল জিপ আনজিপ
          unzip -o "*.zip" -d .

          # ২. অ্যাপ নাম ও থিম ফিক্স
          sed -i 's/<string name="app_name">.*<\/string>/<string name="app_name">mr.wow<\/string>/g' app/src/main/res/values/strings.xml || true
          sed -i 's/Theme.047AutoAccept/Theme.AutoAccept/g' app/src/main/res/values/themes.xml || true
          sed -i 's/Theme.047AutoAccept/Theme.AutoAccept/g' app/src/main/AndroidManifest.xml || true

          # ৩. মিসিং আইকন ফাইল তৈরি
          mkdir -p app/src/main/res/drawable
          mkdir -p app/src/main/res/mipmap
          mkdir -p app/src/main/res/mipmap-anydpi-v26

          cat << 'EOF' > app/src/main/res/drawable/ic_mcd_bg.xml
          <?xml version="1.0" encoding="utf-8"?>
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="108dp"
              android:height="108dp"
              android:viewportWidth="108"
              android:viewportHeight="108">
              <path
                  android:fillColor="#DA291C"
                  android:pathData="M0,0h108v108h-108z"/>
          </vector>
          EOF

          cat << 'EOF' > app/src/main/res/drawable/ic_mcd_fg.xml
          <?xml version="1.0" encoding="utf-8"?>
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="108dp"
              android:height="108dp"
              android:viewportWidth="108"
              android:viewportHeight="108">
              <path
                  android:fillColor="#FFC72C"
                  android:pathData="M24,78 C24,45 36,32 48,32 C52,32 54,37 54,44 C54,37 56,32 60,32 C72,32 84,45 84,78 L74,78 C74,48 66,40 60,40 C56,40 54,46 54,58 L54,78 L48,78 L48,58 C48,46 46,40 42,40 C36,40 28,48 28,78 Z" />
          </vector>
          EOF

          cat << 'EOF' > app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml
          <?xml version="1.0" encoding="utf-8"?>
          <adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">
              <background android:drawable="@drawable/ic_mcd_bg"/>
              <foreground android:drawable="@drawable/ic_mcd_fg"/>
          </adaptive-icon>
          EOF

          cp app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml app/src/main/res/mipmap-anydpi-v26/ic_launcher_round.xml
          cp app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml app/src/main/res/mipmap/ic_launcher.xml
          cp app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml app/src/main/res/mipmap/ic_launcher_round.xml

          # ৪. অ্যাক্সেসিবিলিটি সার্ভিস কনফিগে সোয়াইপ পারমিশন নিশ্চিত করা
          mkdir -p app/src/main/res/xml
          cat << 'EOF' > app/src/main/res/xml/accessibility_service_config.xml
          <?xml version="1.0" encoding="utf-8"?>
          <accessibility-service xmlns:android="http://schemas.android.com/apk/res/android"
              android:accessibilityEventTypes="typeWindowStateChanged|typeWindowContentChanged"
              android:accessibilityFeedbackType="feedbackGeneric"
              android:accessibilityFlags="flagDefault|flagRetrieveInteractiveWindows|flagIncludeNotImportantViews"
              android:canPerformGestures="true"
              android:canRetrieveWindowContent="true"
              android:description="@string/app_name"
              android:notificationTimeout="80" />
          EOF

          # ৫. অ্যাক্সেসিবিলিটি সার্ভিসে সরাসরি ইউনিভার্সাল সোয়াইপ হ্যান্ডলার যুক্ত করা
          cat << 'EOF' > app/src/main/java/com/autoaccept/store047/service/AutoAcceptAccessibilityService.kt
          package com.autoaccept.store047.service

          import android.accessibilityservice.AccessibilityService
          import android.accessibilityservice.GestureDescription
          import android.graphics.Path
          import android.graphics.Rect
          import android.view.accessibility.AccessibilityEvent
          import android.view.accessibility.AccessibilityNodeInfo
          import com.autoaccept.store047.data.PreferencesManager

          class AutoAcceptAccessibilityService : AccessibilityService() {

              private lateinit var prefs: PreferencesManager
              private var lastProcessedTime: Long = 0

              override fun onServiceConnected() {
                  super.onServiceConnected()
                  prefs = PreferencesManager.getInstance(this)
              }

              override fun onAccessibilityEvent(event: AccessibilityEvent?) {
                  if (event == null) return
                  if (!prefs.isAutomationEnabled.value) return

                  val root = rootInActiveWindow ?: return
                  val currentTime = System.currentTimeMillis()
                  if (currentTime - lastProcessedTime < 2000) return

                  val texts = mutableListOf<String>()
                  collectTexts(root, texts)
                  val combined = texts.joinToString(" ").lowercase()

                  if (combined.contains("047") || combined.contains("nahda") || combined.contains("6283")) {
                      val acceptNode = findAcceptNode(root)
                      lastProcessedTime = currentTime

                      if (acceptNode != null) {
                          val bounds = Rect()
                          acceptNode.getBoundsInScreen(bounds)

                          val startX = bounds.left.toFloat() + (bounds.height().toFloat() / 2f)
                          val endX = bounds.right.toFloat() - 20f
                          val centerY = bounds.centerY().toFloat()

                          performSwipe(startX, endX, centerY)
                          try {
                              acceptNode.performAction(AccessibilityNodeInfo.ACTION_CLICK)
                          } catch (e: Exception) {}
                      } else {
                          val metrics = resources.displayMetrics
                          val w = metrics.widthPixels.toFloat()
                          val h = metrics.heightPixels.toFloat()
                          performSwipe(w * 0.15f, w * 0.88f, h * 0.52f)
                      }
                  }
              }

              private fun performSwipe(startX: Float, endX: Float, y: Float) {
                  val swipePath = Path().apply {
                      moveTo(startX, y)
                      lineTo(endX, y)
                  }
                  val gesture = GestureDescription.Builder()
                      .addStroke(GestureDescription.StrokeDescription(swipePath, 0, 400))
                      .build()
                  dispatchGesture(gesture, null, null)
              }

              private fun findAcceptNode(node: AccessibilityNodeInfo): AccessibilityNodeInfo? {
                  val text = (node.text?.toString() ?: "") + " " + (node.contentDescription?.toString() ?: "")
                  val lower = text.lowercase()
                  if (lower.contains("accept") || lower.contains("swipe") || lower.contains("slide")) {
                      return node
                  }
                  for (i in 0 until node.childCount) {
                      val child = node.getChild(i) ?: continue
                      val found = findAcceptNode(child)
                      if (found != null) return found
                  }
                  return null
              }

              private fun collectTexts(node: AccessibilityNodeInfo, list: MutableList<String>) {
                  node.text?.let { list.add(it.toString()) }
                  node.contentDescription?.let { list.add(it.toString()) }
                  for (i in 0 until node.childCount) {
                      val child = node.getChild(i) ?: continue
                      collectTexts(child, list)
                  }
              }

              override fun onInterrupt() {}
          }
          EOF

          # ৬. APK কম্পাইল
          gradle assembleDebug

      - name: Upload Finished APK
        uses: actions/upload-artifact@v4
        with:
          name: mr-wow-APK
          path: app/build/outputs/apk/debug/*.apk
